# LLM Completion 供应商链配置模板
# ============================================================
# 使用方式：复制为 llm_providers.yaml 并按需调整
#   cp llm_providers.example.yaml llm_providers.yaml
#
# 密钥全部通过 ${VAR} 占位符引用 .env / 环境变量，本文件不含真实密钥，可提交 git。
# 真实文件 llm_providers.yaml 已加入 .gitignore，按环境各自维护。
#
# 链路调整方式：
#   - 优先级 = completion_providers 列表顺序（第一个是首选），挪块即调整
#   - 增删供应商 = 增删一个 `- name: ...` 块
#   - 关闭 fallback = 列表只留首选一个块
#   - 更换首选 = 把对应块挪到第一位
#   - 本文件不存在或 completion_providers 为空时，自动回退到 .env 中
#     LLM_COMPLETION_API_* 三个变量组装的单供应商（无 fallback）
# ============================================================

completion_timeout_seconds: 60      # 单次请求超时（秒），覆盖建连 + 首 token

completion_providers:               # 顺序 = 优先级，第一个是首选
  - name: deepseek
    api_url: https://api.deepseek.com
    api_key: ${LLM_DEEPSEEK_API_KEY}
    model_name: deepseek-chat

  - name: qwen                      # DashScope OpenAI 兼容模式（key 与 embedding 相同）
    api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${LLM_QWEN_API_KEY}
    model_name: qwen-plus

  - name: glm                       # 智谱 GLM Flash 免费兜底
    api_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${LLM_GLM_API_KEY}
    model_name: glm-4.7-flash
