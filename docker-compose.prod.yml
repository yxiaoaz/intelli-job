version: '3.8'

# 说明：生产环境配置，backend 使用 ACR 镜像（不再本地 build）
# 镜像地址：crpi-i11ggj6kxu6k4yq3.cn-hongkong.personal.cr.aliyuncs.com/intelli-job/intelli-job-backend:latest
# CORS 由 Caddy 反代处理（见 /etc/caddy/Caddyfile），无需 nginx

services:
  backend:
    image: crpi-i11ggj6kxu6k4yq3.cn-hongkong.personal.cr.aliyuncs.com/intelli-job/intelli-job-backend:latest
    container_name: intellijob-backend
    restart: always
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  # Dozzle: 轻量级 Docker 日志面板
  # 访问方式：SSH 隧道（绑定 127.0.0.1 避免公网暴露）
  # 本地执行：ssh -L 8080:127.0.0.1:8080 admin@<服务器IP>
  # 然后浏览器访问 http://localhost:8080
  dozzle:
    image: amir20/dozzle:latest
    container_name: intellijob-dozzle
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
