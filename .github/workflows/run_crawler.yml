name: Run Job Crawler

on:
  schedule:
    - cron: "0 18 * * *"  # 每天北京时间凌晨 2 点（UTC 18:00）
  workflow_dispatch:        # 手动触发
    inputs:
      item_count:
        description: '每个 spider 爬取的最大条数'
        required: false
        default: '10000'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ATS 三源独立 step：Lever 长延迟（55~61s），独立限时避免拖垮整体；
      # 失败不影响后续国内源 step
      - name: Run ATS scrapers (Greenhouse/Lever/Ashby)
        working-directory: backend
        run: python run_crawler.py
        timeout-minutes: 30
        env:
          CRAWLER_SOURCE_FILTER: lever,greenhouse,ashby
          SCRAPY_CLOSESPIDER_ITEMCOUNT: ${{ github.event.inputs.item_count || '10000' }}
          RDS_DRIVERNAME: ${{ secrets.RDS_DRIVERNAME }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_DB_NAME: ${{ secrets.RDS_DB_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ZILLIZ_URI: ${{ secrets.ZILLIZ_URI }}
          ZILLIZ_TOKEN: ${{ secrets.ZILLIZ_TOKEN }}
          ZILLIZ_JOB_ITEM_COLLECTION_NAME: ${{ secrets.ZILLIZ_JOB_ITEM_COLLECTION_NAME }}
          LLM_EMBEDDING_API_KEY: ${{ secrets.LLM_EMBEDDING_API_KEY }}
          LLM_EMBEDDING_API_URL: ${{ secrets.LLM_EMBEDDING_API_URL }}
          LLM_EMBEDDING_API_MODEL_NAME: ${{ secrets.LLM_EMBEDDING_API_MODEL_NAME }}
          LLM_COMPLETION_API_KEY: ${{ secrets.LLM_COMPLETION_API_KEY }}
          LLM_COMPLETION_API_URL: ${{ secrets.LLM_COMPLETION_API_URL }}
          LLM_COMPLETION_API_MODEL_NAME: ${{ secrets.LLM_COMPLETION_API_MODEL_NAME }}

      - name: Run domestic scrapers
        working-directory: backend
        run: python run_crawler.py
        # nowcoder 实测单轮 12–18 分钟（850–1100 请求，探活报告六.1.1），限时 45 分钟兜底
        timeout-minutes: 45
        env:
          CRAWLER_SOURCE_FILTER: shixiseng,zhilian,nowcoder
          SCRAPY_CLOSESPIDER_ITEMCOUNT: ${{ github.event.inputs.item_count || '10000' }}
          RDS_DRIVERNAME: ${{ secrets.RDS_DRIVERNAME }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_DB_NAME: ${{ secrets.RDS_DB_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ZILLIZ_URI: ${{ secrets.ZILLIZ_URI }}
          ZILLIZ_TOKEN: ${{ secrets.ZILLIZ_TOKEN }}
          ZILLIZ_JOB_ITEM_COLLECTION_NAME: ${{ secrets.ZILLIZ_JOB_ITEM_COLLECTION_NAME }}
          LLM_EMBEDDING_API_KEY: ${{ secrets.LLM_EMBEDDING_API_KEY }}
          LLM_EMBEDDING_API_URL: ${{ secrets.LLM_EMBEDDING_API_URL }}
          LLM_EMBEDDING_API_MODEL_NAME: ${{ secrets.LLM_EMBEDDING_API_MODEL_NAME }}
          LLM_COMPLETION_API_KEY: ${{ secrets.LLM_COMPLETION_API_KEY }}
          LLM_COMPLETION_API_URL: ${{ secrets.LLM_COMPLETION_API_URL }}
          LLM_COMPLETION_API_MODEL_NAME: ${{ secrets.LLM_COMPLETION_API_MODEL_NAME }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7
          if-no-files-found: ignore
