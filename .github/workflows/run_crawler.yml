name: Run Job Crawler

on:
  # schedule:
  #   - cron: "0 18 * * *"  # 每天北京时间凌晨 2 点（UTC 18:00）—— 先注释，手动测试通过后再开
  workflow_dispatch:        # 手动触发
    inputs:
      item_count:
        description: '每个 spider 爬取的最大条数（测试用，默认 100，正式可设 10000）'
        required: false
        default: '100'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run scraper
        working-directory: backend
        run: python run_crawler.py
        env:
          # 爬虫规模控制（覆盖 settings.py 的 CLOSESPIDER_ITEMCOUNT=10000）
          SCRAPY_CLOSESPIDER_ITEMCOUNT: ${{ github.event.inputs.item_count || '100' }}
          # PostgreSQL（RDS）
          RDS_DRIVERNAME: ${{ secrets.RDS_DRIVERNAME }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_DB_NAME: ${{ secrets.RDS_DB_NAME }}
          # Redis（端口在 pipelines.py 硬编码为 10771，只传 host 和 password）
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          # Zilliz Cloud 向量库
          ZILLIZ_URI: ${{ secrets.ZILLIZ_URI }}
          ZILLIZ_TOKEN: ${{ secrets.ZILLIZ_TOKEN }}
          ZILLIZ_JOB_ITEM_COLLECTION_NAME: ${{ secrets.ZILLIZ_JOB_ITEM_COLLECTION_NAME }}
          # LLM - Embedding（爬虫 pipeline 生成 embedding 需要）
          LLM_EMBEDDING_API_KEY: ${{ secrets.LLM_EMBEDDING_API_KEY }}
          LLM_EMBEDDING_API_URL: ${{ secrets.LLM_EMBEDDING_API_URL }}
          LLM_EMBEDDING_API_MODEL_NAME: ${{ secrets.LLM_EMBEDDING_API_MODEL_NAME }}
          # LLM - Completion（Settings 初始化必填，不传会报错）
          LLM_COMPLETION_API_KEY: ${{ secrets.LLM_COMPLETION_API_KEY }}
          LLM_COMPLETION_API_URL: ${{ secrets.LLM_COMPLETION_API_URL }}
          LLM_COMPLETION_API_MODEL_NAME: ${{ secrets.LLM_COMPLETION_API_MODEL_NAME }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7
          if-no-files-found: ignore
