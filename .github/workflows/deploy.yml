name: Deploy Backend

# 触发条件：
# 1. push 到 main 分支且改动了后端相关文件
# 2. 手动在 GitHub Actions 页面点 "Run workflow"
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - 'docker-compose.prod.yml'
      - 'nginx.conf'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 全局环境变量 - ACR_REGISTRY 已更新为你的实际仓库地址
env:
  ACR_REGISTRY: crpi-i11ggj6kxu6k4yq3.cn-hongkong.personal.cr.aliyuncs.com
  ACR_NAMESPACE: intelli-job
  IMAGE_NAME: intelli-job-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: 拉取代码到 Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: 登录阿里云 ACR
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Step 3: 配置 Docker Buildx（支持 layer cache）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: 构建镜像并推送到 ACR
      # - 用 github.sha 作为版本号方便回滚
      # - cache-from/to 用 GitHub Actions cache 加速后续构建
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Debug: 打印 SSH 配置（不打印 key）
      - name: Debug SSH config
        run: |
          echo "SSH_HOST length: ${#SSH_HOST}"
          echo "SSH_USER length: ${#SSH_USER}"
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
          echo "SSH_PRIVATE_KEY first line: $(echo "$SSH_PRIVATE_KEY" | head -1)"
          echo "SSH_PRIVATE_KEY last line: $(echo "$SSH_PRIVATE_KEY" | tail -1)"
          echo "SSH_PRIVATE_KEY line count: $(echo "$SSH_PRIVATE_KEY" | wc -l)"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # Step 5-8: SSH 到服务器执行部署
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Step 5: 拉取最新代码 ==="
            cd /opt/intelli-job
            git pull origin master

            echo "=== Step 6: 登录 ACR 并拉取新镜像 ==="
            docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ env.ACR_REGISTRY }}
            docker compose -f docker-compose.prod.yml pull backend

            echo "=== Step 7: 重启服务 ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans backend nginx dozzle

            echo "=== Step 8: 健康检查 ==="
            sleep 8
            for i in 1 2 3; do
              if curl -fsS http://localhost:8000/health; then
                echo ""
                echo "✅ 部署成功！"
                exit 0
              fi
              echo "等待 5 秒后重试..."
              sleep 5
            done
            echo "❌ 健康检查失败，请检查日志：docker compose -f docker-compose.prod.yml logs backend"
            exit 1
